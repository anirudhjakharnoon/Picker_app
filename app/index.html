<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#222223" />
    <!-- Installable standalone app. On iOS 15 (which does NOT honor the web
         manifest's display:standalone - that needs iOS 16.4+), the legacy
         apple-mobile-web-app-capable meta is what makes "Add to Home Screen"
         launch full-screen instead of reopening Safari. "default" keeps an
         opaque status bar so the clock/battery never overlap app content. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DM Ops" />
    <meta name="application-name" content="DM Ops" />
    <meta
      name="description"
      content="Dubai Mall Online delivery operations - picker and sort wall app for pickers, warehouse staff, and ops. Requires an active network connection."
    />
    <title>Dubai Mall Online - Delivery Ops</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
